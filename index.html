<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="La carte Visa YoungPay : rechargez-la par mobile money (Orange Money, KULU ou Soutra Money) et payez en ligne partout dans le monde depuis la Guinée. Carte virtuelle et physique." />
    <link rel="icon" type="image/png" href="/assets/images/logo_icon.png" />
    <meta name="theme-color" content="#1E5BB8" />
    <!-- Polices : preconnect + display=swap pour ne pas bloquer le rendu -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <!-- DNS prefetch pour l'API -->
    <link rel="dns-prefetch" href="https://api.young-pay.net" />
    <title>Carte Visa YoungPay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
